<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TN-GLMS stakeholder platform flow</title><desc id="desc">Editable system drawing connecting citizens, field teams, departments, project agencies and an auditable platform.</desc>
<defs><style>.bg{fill:#10243a}.panel{fill:#173653;stroke:#4c7894;stroke-width:2}.core{fill:#f5c767}.ink{fill:#fff}.sub{fill:#c4d8e6}.ln{stroke:#79b6c8;stroke-width:5;fill:none}.t{font-family:Arial,sans-serif}.h{font-size:28px;font-weight:700}.s{font-size:18px}.k{font-size:15px;font-weight:700;letter-spacing:1.3px}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#79b6c8"/></marker></defs>
<rect class="bg" width="1600" height="900"/><text x="90" y="92" class="t ink" font-size="50" font-weight="700">ONE PLATFORM. FIVE PARTICIPANTS. ONE AUDIT TRAIL.</text><text x="92" y="128" class="t sub s">A demo-friendly view of how TN-GLMS keeps the acquisition lifecycle coordinated.</text>
