<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TN-GLMS land acquisition lifecycle</title>
  <desc id="desc">An editable visual showing eight stages from citizen request to transparent delivery.</desc>
  <defs>
    <style>
      .bg{fill:#f7f2e9}.ink{fill:#13243a}.muted{fill:#536373}.line{stroke:#90a0ae;stroke-width:4;fill:none}.card{fill:#fffdf9;stroke:#d8cdbd;stroke-width:2}.num{fill:#0b5394}.green{fill:#17805f}.gold{fill:#c9860a}.rust{fill:#c34c30}.teal{fill:#0b7b79}.t{font-family:Arial,sans-serif}.h{font-weight:700;font-size:27px}.s{font-size:17px}.k{font-size:14px;letter-spacing:1.4px;font-weight:700}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#90a0ae"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="90" y="92" class="t ink" font-size="50" font-weight="700">ONE TRANSPARENT PROJECT LIFECYCLE</text>
  <text x="94" y="128" class="t muted" font-size="22">TN-GLMS connects citizens, field teams, government and delivery agencies in one auditable record.</text>
  <path class="line" marker-end="url(#arrow)" d="M260 300H380M620 300H740M980 300H1100M1340 300V600H1220M980 690H860M620 690H500M260 690V420"/>
  <g transform="translate(80 195)"><rect class="card" rx="18" width="180" height="210"/><circle class="num" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">1</text><text x="24" y="83" class="t ink h">Need</text><text x="24" y="108" class="t ink h">raised</text><text x="24" y="145" class="t muted s">Citizen request</text><text x="24" y="169" class="t muted s">Public tracking</text></g>
  <g transform="translate(440 195)"><rect class="card" rx="18" width="180" height="210"/><circle class="teal" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">2</text><text x="24" y="83" class="t ink h">Plan &amp;</text><text x="24" y="108" class="t ink h">survey</text><text x="24" y="145" class="t muted s">GIS alignment</text><text x="24" y="169" class="t muted s">SIA &amp; notices</text></g>
  <g transform="translate(800 195)"><rect class="card" rx="18" width="180" height="210"/><circle class="gold" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">3</text><text x="24" y="83" class="t ink h">Lawful</text><text x="24" y="108" class="t ink h">approval</text><text x="24" y="145" class="t muted s">Role-based action</text><text x="24" y="169" class="t muted s">Audit history</text></g>
  <g transform="translate(1160 195)"><rect class="card" rx="18" width="180" height="210"/><circle class="rust" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">4</text><text x="24" y="83" class="t ink h">Award &amp;</text><text x="24" y="108" class="t ink h">payment</text><text x="24" y="145" class="t muted s">Parcel records</text><text x="24" y="169" class="t muted s">Legal safeguards</text></g>
  <g transform="translate(1040 585)"><rect class="card" rx="18" width="180" height="210"/><circle class="green" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">5</text><text x="24" y="83" class="t ink h">R&amp;R</text><text x="24" y="108" class="t ink h">support</text><text x="24" y="145" class="t muted s">Families &amp; heirs</text><text x="24" y="169" class="t muted s">Entitlements</text></g>
  <g transform="translate(680 585)"><rect class="card" rx="18" width="180" height="210"/><circle class="teal" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">6</text><text x="24" y="83" class="t ink h">Ready land</text><text x="24" y="108" class="t ink h">&amp; services</text><text x="24" y="145" class="t muted s">Possession</text><text x="24" y="169" class="t muted s">Infrastructure</text></g>
  <g transform="translate(320 585)"><rect class="card" rx="18" width="180" height="210"/><circle class="gold" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">7</text><text x="24" y="83" class="t ink h">Tender &amp;</text><text x="24" y="108" class="t ink h">deliver</text><text x="24" y="145" class="t muted s">Contractors</text><text x="24" y="169" class="t muted s">Progress evidence</text></g>
  <g transform="translate(80 585)"><rect class="card" rx="18" width="180" height="210"/><circle class="num" cx="35" cy="35" r="22"/><text x="28" y="42" fill="#fff" class="t" font-weight="700">8</text><text x="24" y="83" class="t ink h">Public</text><text x="24" y="108" class="t ink h">accountability</text><text x="24" y="145" class="t muted s">Grievances</text><text x="24" y="169" class="t muted s">Reports &amp; notices</text></g>
  <text x="800" y="857" text-anchor="middle" class="t muted k">EACH STAGE HAS OWNERSHIP, EVIDENCE, DEADLINES AND A TRACEABLE DECISION HISTORY</text>
</svg>
